name: home_inventory
description: >-
  Offline-first household inventory: what you own, where it is, what is
  running low, and what you need to buy or can sell. CRDT-synced between
  phone and desktop through a private GitHub repo used as dumb storage.
publish_to: 'none'
# The build number is deliberately far above CI's counter. CI overrides it with
# `--build-number=${{ github.run_number }}` on every release build, so this
# value only ever reaches a LOCAL build — and a local build has to out-rank the
# CI-built APK already on the phone or `adb install -r` refuses it as a
# downgrade. Left at +1 it always loses, which makes local install-over
# impossible rather than merely awkward. Raise it, never lower it.
version: 0.1.0+61

environment:
  sdk: ^3.12.2

dependencies:
  # Shared CRDT log + GitHub-as-storage sync, pinned to the same tag the
  # other consumers (todo, diet_guard) use. Never track a branch: a library
  # change would then break the app with no local diff to explain it.
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.11.1
      path: crdt_sync_dart

  cupertino_icons: 1.0.9
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.0.0

  github_device_auth:
    git:
      url: https://github.com/kuhyx/utils
      ref: github_device_auth-v0.3.1
      path: github_device_auth
  # One-tap sign-in for the sync account. App-side only: crdt_sync stays pure
  # Dart so it keeps working on Linux desktop and headless.
  google_sign_in: 7.2.0
  http: 1.6.0
  idb_shim: 2.9.8
  # For @immutable on the pure-Dart models. Deliberately not
  # `package:flutter/foundation.dart`, which exports the same annotation: the
  # models are reachable from `tool/sync_smoke.dart`, which runs under plain
  # `dart run` and cannot load the Flutter SDK.
  meta: 1.19.0
  path: 1.9.1
  path_provider: 2.1.6
  share_plus: 13.3.0
  shared_preferences: 2.5.5
  # Shared "Sync settings" screen (Firebase + Backup), identical in shape
  # across every kuhy app that syncs. GitHub mirror stays app-local (see
  # lib/screens/github_mirror_screen.dart) since here it also triggers a real
  # inventory sync, not just a settings save.
  sync_settings_ui:
    git:
      url: https://github.com/kuhyx/utils
      ref: sync_settings_ui-v0.4.1
      path: sync_settings_ui
  url_launcher: 6.3.2
  uuid: 4.6.0

dev_dependencies:
  fake_async: 1.3.3
  # Platform-interface packages let widget tests fake the picker/launcher
  # instead of reaching a real platform channel — which is what keeps the
  # settings-screen paths genuinely covered rather than `coverage:ignore`d.
  file_selector_platform_interface: 2.7.0
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  plugin_platform_interface: 2.1.8
  url_launcher_platform_interface: 2.3.2
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
