# Pre-commit configuration for home_inventory
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files

default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # The committed launcher icons (Android mipmaps + the hicolor PNGs the
        # .desktop entry installs) are the only binaries here, and the largest
        # is well under this.
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # Fails a commit that still points crdt_sync at a local path. Local
      # tests would go green against a library CI has never seen, silently.
      - id: crdt-sync-override
        name: no local crdt_sync dependency_override
        entry: bash scripts/check_no_crdt_sync_override.sh pubspec.yaml
        language: system
        pass_filenames: false
        always_run: true
      # Pre-push rather than pre-commit: a full clean build plus the coverage
      # and web-build gates takes minutes, which is a reasonable price once per
      # push and an unreasonable one per commit.
      # Split into <60 s steps, run in this order.
      - id: ci-mirror-setup
        name: CI mirror 1 (clean, pub get)
        entry: bash scripts/ci_mirror.sh setup
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-analyze
        name: CI mirror 2 (file length, analyze)
        entry: bash scripts/ci_mirror.sh analyze
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-format
        name: CI mirror 3 (format)
        entry: bash scripts/ci_mirror.sh format
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-1
        name: CI mirror 4 (tests, shard 1/6)
        entry: bash scripts/ci_mirror.sh coverage --shard 0/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-2
        name: CI mirror 5 (tests, shard 2/6)
        entry: bash scripts/ci_mirror.sh coverage --shard 1/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-3
        name: CI mirror 6 (tests, shard 3/6)
        entry: bash scripts/ci_mirror.sh coverage --shard 2/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-4
        name: CI mirror 7 (tests, shard 4/6)
        entry: bash scripts/ci_mirror.sh coverage --shard 3/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-5
        name: CI mirror 8 (tests, shard 5/6)
        entry: bash scripts/ci_mirror.sh coverage --shard 4/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-cov-6
        name: CI mirror 9 (tests, shard 6/6)
        entry: bash scripts/ci_mirror.sh coverage --shard 5/6
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      # Same 100% bar and every-lib-file guard, on the union of the shards.
      - id: ci-mirror-cov-merge
        name: CI mirror 10 (coverage 100%, union of shards)
        entry: bash scripts/ci_mirror.sh coverage-merge
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-build
        name: CI mirror 11 (web build)
        entry: bash scripts/ci_mirror.sh build
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # No file over 250 lines. A file that cannot be read in one piece
      # forces re-reads and partial edits, which is the largest avoidable
      # cost in an LLM-assisted workflow. Checks the files in the commit, so
      # an unrelated commit never trips over someone else's long file; the
      # file-length workflow covers the whole tree on push.
      - id: file-length
        name: files under 250 lines
        entry: scripts/check_file_length.sh
        language: system
        files: \.(dart|sh|py|yaml|yml|md|markdown|txt)$

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*), plus the
      # rule that a TODO carries "REMOVE ME AFTER FINISH" and nothing else may.
      # Shared gate in ~/src/utils owns the namespaces and the exemption list, so
      # one repo's idea of a valid name cannot drift from every other repo's.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      # Every dependency on its ecosystem's newest STABLE release, exact-pinned
      # so the question is mechanically answerable at all.
      #
      # `files:` is what keeps this cheap: a commit touching only source makes
      # ZERO network requests, and manifest commits mostly hit a 6h disk cache.
      #
      # Runs WITHOUT --strict on purpose. Offline it degrades to the cached
      # answer and passes with a loud banner; `--no-verify` is banned here, so
      # a hook that hard-failed on a flaky connection would leave no way to
      # commit at all. CI, always online, is the strict authority.
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt|uv\.lock
          |package\.json|package-lock\.json|pnpm-lock\.yaml
          |Cargo\.(toml|lock)|go\.(mod|sum)
          |\.fvmrc|\.nvmrc|\.python-version)$

  - repo: local
    hooks:
      # The only pre-push hook. Everything that used to run here is now
      # `stages: [manual]` -- run on demand with `scripts/check_gate_stamp.sh
      # full`, and by CI on every push. finish_auto.sh stamps HEAD after its
      # gate; a tree without that receipt cannot leave the machine.
      - id: gate-stamp
        name: pushed tree passed the local gate (stamp check)
        entry: scripts/check_gate_stamp.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$|(^|/)(AndroidManifest\.xml|build\.gradle(\.kts)?|strings\.xml|pubspec\.yaml|repo-contract\.toml|[^/]+\.desktop|assets/icon/[^/]+\.png)$
